<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𝕏 (goygoy sürümü)</title>
<style>
  :root{
    --bg:#000000;
    --panel:#000000;
    --hover:rgba(239,243,244,0.1);
    --border:#2f3336;
    --text:#e7e9ea;
    --dim:#71767b;
    --blue:#1d9bf0;
    --blue-hover:#1a8cd8;
    --red:#f91880;
    --green:#00ba7c;
    --gold:#ffd400;
  }
  html[data-theme="light"]{
    --bg:#ffffff;
    --panel:#ffffff;
    --hover:rgba(15,20,25,0.1);
    --border:#eff3f4;
    --text:#0f1419;
    --dim:#536471;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    transition:background 0.2s, color 0.2s;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  .app{
    display:flex;
    max-width:1280px;
    margin:0 auto;
    min-height:100vh;
    align-items:flex-start;
  }

  /* ================= LEFT SIDEBAR ================= */
  .sidebar-left{
    width:275px;
    flex-shrink:0;
    position:sticky;
    top:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:8px 12px;
    border-right:1px solid var(--border);
  }
  .logo{
    font-size:28px;
    padding:10px;
    width:52px;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    cursor:pointer;
    font-weight:800;
  }
  .logo:hover{background:var(--hover);}
  .nav-list{margin-top:6px;display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px;
    border-radius:999px;
    cursor:pointer;
    font-size:20px;
    width:fit-content;
    max-width:100%;
  }
  .nav-item:hover{background:var(--hover);}
  .nav-item.active{font-weight:800;}
  .nav-item .icon{width:26px;text-align:center;font-size:22px;flex-shrink:0;}
  .nav-item .badge-dot{
    background:var(--blue);
    color:#fff;
    font-size:11px;
    font-weight:700;
    border-radius:999px;
    padding:0 6px;
    margin-left:4px;
  }
  .nav-post-btn{
    background:var(--blue);
    color:#fff;
    border:none;
    font-weight:800;
    font-size:17px;
    padding:14px 0;
    border-radius:999px;
    cursor:pointer;
    margin:14px 8px 0 8px;
    width:88%;
  }
  .nav-post-btn:hover{background:var(--blue-hover);}
  .sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px;}
  .theme-toggle-btn{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 12px;
    border-radius:999px;
    cursor:pointer;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    font-size:14px;
    width:fit-content;
  }
  .theme-toggle-btn:hover{background:var(--hover);}
  .user-card{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    border-radius:999px;
    cursor:pointer;
  }
  .user-card:hover{background:var(--hover);}
  .user-card .uc-name-wrap{flex:1;min-width:0;}
  .user-card .uc-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px;}
  .user-card .uc-handle{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ================= CENTER COLUMN ================= */
  .main-col{
    width:600px;
    flex-shrink:0;
    border-right:1px solid var(--border);
    min-height:100vh;
  }
  header.topbar{
    position:sticky;
    top:0;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:10px 16px;
    display:flex;
    align-items:center;
    z-index:20;
    gap:20px;
  }
  html[data-theme="light"] header.topbar{background:rgba(255,255,255,0.85);}
  #back-btn{
    display:none;
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--text);
    font-size:18px;
    cursor:pointer;
    align-items:center;
    justify-content:center;
  }
  #back-btn:hover{background:var(--hover);}
  #header-title{font-size:19px;font-weight:800;line-height:1.1;}
  #header-sub{font-size:12px;color:var(--dim);font-weight:400;margin-top:1px;}

  .nav-tabs{display:flex;border-bottom:1px solid var(--border);}
  .nav-tab{
    flex:1;text-align:center;padding:14px 0;color:var(--dim);
    cursor:pointer;font-weight:600;font-size:15px;position:relative;
  }
  .nav-tab:hover{background:var(--hover);}
  .nav-tab.active{color:var(--text);}
  .nav-tab.active::after{
    content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:56px;height:4px;background:var(--blue);border-radius:4px;
  }

  /* ---- Composer ---- */
  .composer{display:flex;gap:12px;padding:16px;border-bottom:8px solid #16181c;}
  html[data-theme="light"] .composer{border-bottom-color:#eff3f4;}
  .avatar{
    width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg,#7856ff,#1d9bf0);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:16px;color:#fff;overflow:hidden;cursor:pointer;
    background-size:cover;background-position:center;
  }
  .composer-body{flex:1;min-width:0;}
  textarea{
    width:100%;background:transparent;border:none;outline:none;resize:none;
    color:var(--text);font-size:19px;font-family:inherit;min-height:60px;line-height:1.4;
  }
  textarea::placeholder{color:var(--dim);}
  #img-preview-wrap{position:relative;margin-top:8px;display:none;}
  #img-preview{max-width:100%;max-height:300px;border-radius:16px;border:1px solid var(--border);display:block;}
  #remove-img{
    position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.75);color:#fff;
    border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:16px;line-height:1;
  }
  .composer-toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:12px;border-top:1px solid var(--border);padding-top:10px;}
  .tool-icons{display:flex;gap:4px;align-items:center;}
  .icon-btn{
    width:36px;height:36px;border-radius:50%;border:none;background:transparent;
    color:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:18px;transition:background 0.15s;
  }
  .icon-btn:hover{background:rgba(29,155,240,0.1);}
  .char-count{font-size:13px;color:var(--dim);min-width:34px;text-align:right;}
  .char-count.warn{color:#ffd400;}
  .char-count.over{color:var(--red);}
  #post-btn{
    background:var(--blue);color:#fff;border:none;font-weight:700;padding:8px 20px;
    border-radius:999px;cursor:pointer;font-size:15px;transition:background 0.15s;
  }
  #post-btn:hover{background:var(--blue-hover);}
  #post-btn:disabled{opacity:0.5;cursor:not-allowed;}
  input[type="file"]{display:none;}

  /* ---- Feed / tweets ---- */
  .tweet{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);animation:fadein 0.25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .tweet-body{flex:1;min-width:0;}
  .retweet-tag{font-size:13px;color:var(--dim);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
  .tweet-head{display:flex;align-items:center;gap:6px;font-size:15px;flex-wrap:wrap;}
  .tweet-name{font-weight:700;cursor:pointer;display:flex;align-items:center;gap:3px;}
  .tweet-name:hover{text-decoration:underline;}
  .tweet-handle,.tweet-time{color:var(--dim);}
  .verified-badge{color:var(--blue);font-size:14px;}
  .tweet-text{margin:2px 0 8px 0;font-size:15px;line-height:1.4;white-space:pre-wrap;word-break:break-word;}
  .tweet-img{max-width:100%;border-radius:16px;border:1px solid var(--border);display:block;margin-bottom:8px;}
  .tweet-actions{display:flex;justify-content:space-between;max-width:420px;margin-top:4px;}
  .action{
    display:flex;align-items:center;gap:5px;color:var(--dim);font-size:13px;
    background:none;border:none;cursor:pointer;padding:6px;border-radius:999px;transition:all 0.15s;
  }
  .action:hover{color:var(--blue);background:rgba(29,155,240,0.1);}
  .action.liked{color:var(--red);}
  .action.liked:hover{color:var(--red);background:rgba(249,24,128,0.1);}
  .action.rt.active{color:var(--green);}
  .action.rt:hover{color:var(--green);background:rgba(0,186,124,0.1);}
  .action.bookmark.active{color:var(--blue);}
  .action.del:hover{color:var(--red);background:rgba(249,24,128,0.1);}

  .reply-thread{margin-top:8px;padding-left:12px;border-left:2px solid var(--border);display:flex;flex-direction:column;gap:10px;}
  .reply-item{display:flex;gap:8px;font-size:13px;}
  .reply-item .avatar{width:28px;height:28px;font-size:12px;}
  .reply-item .reply-body{flex:1;}
  .reply-item .reply-head{font-weight:700;}
  .reply-item .reply-head span{font-weight:400;color:var(--dim);margin-left:4px;}
  .reply-item .reply-text{color:var(--text);margin-top:1px;}

  .empty{text-align:center;color:var(--dim);padding:60px 20px;font-size:15px;}
  .empty span{font-size:40px;display:block;margin-bottom:10px;}

  /* ---- Profile page ---- */
  .profile-banner{
    height:140px;width:100%;background:linear-gradient(135deg,#3a3f44,#16181c);
    background-size:cover;background-position:center;position:relative;cursor:pointer;
  }
  .profile-banner .banner-hint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0);color:#fff;font-size:13px;opacity:0;transition:all 0.15s;
  }
  .profile-banner.editable:hover .banner-hint{opacity:1;background:rgba(0,0,0,0.35);}
  .profile-top{padding:0 16px;position:relative;}
  .profile-avatar-wrap{position:relative;width:88px;margin-top:-44px;}
  .profile-avatar{
    width:88px;height:88px;border-radius:50%;border:4px solid var(--bg);
    background:linear-gradient(135deg,#7856ff,#1d9bf0);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:30px;color:#fff;background-size:cover;background-position:center;overflow:hidden;
  }
  .profile-avatar-wrap.editable{cursor:pointer;}
  .profile-avatar-wrap.editable .avatar-hint{
    position:absolute;inset:4px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0);color:#fff;font-size:11px;opacity:0;transition:all 0.15s;text-align:center;
  }
  .profile-avatar-wrap.editable:hover .avatar-hint{opacity:1;background:rgba(0,0,0,0.45);}
  .profile-actions{display:flex;justify-content:flex-end;padding:12px 0 8px 0;gap:8px;}
  .btn-outline{
    background:transparent;color:var(--text);border:1px solid #536471;font-weight:700;
    padding:7px 16px;border-radius:999px;cursor:pointer;font-size:14px;
  }
  .btn-outline:hover{background:var(--hover);}
  .btn-solid{
    background:var(--text);color:var(--bg);border:none;font-weight:700;
    padding:7px 16px;border-radius:999px;cursor:pointer;font-size:14px;
  }
  .btn-solid:hover{opacity:0.9;}
  .btn-following{background:transparent;color:var(--text);border:1px solid #536471;}
  .btn-following:hover{background:rgba(249,24,128,0.1);color:var(--red);border-color:var(--red);}
  .btn-following:hover::after{content:' bırak';}
  .profile-info{padding:2px 0 12px 0;}
  .profile-info .pname{font-size:20px;font-weight:800;display:flex;align-items:center;gap:4px;}
  .profile-info .phandle{color:var(--dim);font-size:15px;margin-top:1px;}
  .profile-info .pbio{margin-top:12px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-break:break-word;}
  .profile-info .pbio.placeholder{color:var(--dim);font-style:italic;}
  .profile-stats{display:flex;gap:18px;margin-top:12px;font-size:14px;color:var(--dim);}
  .profile-stats b{color:var(--text);}
  .profile-tweets-label{padding:14px 16px 0 16px;font-weight:700;font-size:15px;color:var(--dim);}

  /* ---- Explore ---- */
  .search-box{
    display:flex;align-items:center;gap:10px;background:#202327;border-radius:999px;
    padding:10px 16px;margin:12px 16px;
  }
  html[data-theme="light"] .search-box{background:#eff3f4;}
  .search-box input{
    flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;
  }
  .search-box input::placeholder{color:var(--dim);}
  .trend-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);}
  .trend-item:hover{background:var(--hover);}
  .trend-cat{font-size:12px;color:var(--dim);}
  .trend-name{font-weight:700;font-size:15px;margin-top:2px;}
  .trend-count{font-size:12px;color:var(--dim);margin-top:2px;}
  .section-label{padding:14px 16px 6px 16px;font-weight:800;font-size:19px;}
  .user-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);}
  .user-row .uinfo{flex:1;min-width:0;}
  .user-row .uname{font-weight:700;font-size:14px;display:flex;align-items:center;gap:3px;}
  .user-row .uhandle{font-size:13px;color:var(--dim);}
  .user-row .ubio{font-size:13px;color:var(--text);margin-top:2px;}

  /* ---- Notifications ---- */
  .notif-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);}
  .notif-icon{font-size:22px;width:32px;text-align:center;flex-shrink:0;}
  .notif-icon.like{color:var(--red);}
  .notif-icon.rt{color:var(--green);}
  .notif-icon.follow{color:var(--blue);}
  .notif-body{flex:1;font-size:14px;}
  .notif-body .nb-name{font-weight:700;}
  .notif-body .nb-text{color:var(--dim);margin-top:2px;}

  /* ================= RIGHT SIDEBAR ================= */
  .sidebar-right{
    width:350px;flex-shrink:0;padding:8px 16px;position:sticky;top:0;
    height:100vh;overflow-y:auto;
  }
  .widget{background:#16181c;border-radius:16px;margin-bottom:16px;overflow:hidden;}
  html[data-theme="light"] .widget{background:#f7f9f9;}
  .widget-title{font-weight:800;font-size:19px;padding:12px 16px;}
  .widget .trend-item, .widget .user-row{border-bottom:1px solid var(--border);}
  .widget .trend-item:last-child, .widget .user-row:last-child{border-bottom:none;}
  .follow-btn-small{
    background:var(--text);color:var(--bg);border:none;font-weight:700;
    padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;flex-shrink:0;
  }
  .follow-btn-small:hover{opacity:0.9;}
  .follow-btn-small.following{background:transparent;border:1px solid #536471;color:var(--text);}

  /* ---- Modal (shared) ---- */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(91,112,131,0.4);z-index:100;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--bg);border:1px solid var(--border);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;margin:16px;}
  .modal-header{display:flex;align-items:center;gap:20px;padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);}
  .icon-close{background:transparent;border:none;color:var(--text);font-size:18px;cursor:pointer;width:34px;height:34px;border-radius:50%;}
  .icon-close:hover{background:var(--hover);}
  .modal-header h2{font-size:19px;margin:0;font-weight:800;}
  .modal-header .spacer{flex:1;}
  #save-profile-btn{background:var(--text);color:var(--bg);border:none;font-weight:700;padding:6px 16px;border-radius:999px;cursor:pointer;font-size:14px;}
  #save-profile-btn:hover{opacity:0.9;}
  .modal-banner{height:130px;background:linear-gradient(135deg,#3a3f44,#16181c);background-size:cover;background-position:center;position:relative;cursor:pointer;}
  .modal-banner .banner-edit-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;gap:16px;}
  .circle-edit-btn{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,0.6);border:none;color:#fff;font-size:16px;cursor:pointer;}
  .circle-edit-btn:hover{background:rgba(0,0,0,0.8);}
  .modal-avatar-row{margin-top:-44px;padding:0 16px;}
  .modal-avatar{
    width:88px;height:88px;border-radius:50%;border:4px solid var(--bg);
    background:linear-gradient(135deg,#7856ff,#1d9bf0);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:30px;color:#fff;background-size:cover;background-position:center;position:relative;cursor:pointer;overflow:hidden;
  }
  .modal-avatar .avatar-edit-overlay{position:absolute;inset:4px;border-radius:50%;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;}
  .modal-form{padding:20px 16px 30px 16px;display:flex;flex-direction:column;gap:18px;}
  .field label{display:block;font-size:13px;color:var(--dim);margin-bottom:4px;}
  .field input, .field textarea{
    width:100%;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text);
    font-size:16px;font-family:inherit;padding:10px 10px 20px 10px;outline:none;
  }
  .field input:focus, .field textarea:focus{border-color:var(--blue);}
  .field textarea{resize:none;min-height:70px;}
  .field .count{text-align:right;font-size:12px;color:var(--dim);margin-top:2px;}
  .checkbox-field{display:flex;align-items:center;gap:8px;font-size:15px;}

  /* ---- Reply modal ---- */
  .reply-parent{display:flex;gap:12px;padding:0 16px;}
  .reply-parent-line{width:44px;display:flex;justify-content:center;}
  .reply-parent-line .line{width:2px;flex:1;background:var(--border);margin-top:6px;}
  .reply-parent-body{padding-bottom:10px;font-size:15px;}
  .reply-parent-body .rp-head{display:flex;gap:5px;align-items:center;}
  .reply-parent-body .rp-name{font-weight:700;}
  .reply-parent-body .rp-handle,.reply-parent-body .rp-dim{color:var(--dim);}
  .reply-parent-body .rp-text{margin-top:2px;color:var(--text);}
  .reply-parent-body .rp-to{color:var(--dim);margin-top:6px;font-size:14px;}
  .reply-compose{display:flex;gap:12px;padding:8px 16px 20px 16px;}
  .reply-compose textarea{font-size:19px;}
  .reply-compose-footer{display:flex;justify-content:flex-end;margin-top:10px;}
  #submit-reply-btn{
    background:var(--blue);color:#fff;border:none;font-weight:700;padding:8px 20px;
    border-radius:999px;cursor:pointer;font-size:15px;
  }
  #submit-reply-btn:hover{background:var(--blue-hover);}
  #submit-reply-btn:disabled{opacity:0.5;cursor:not-allowed;}

  /* ================= RESPONSIVE ================= */
  @media (max-width:1100px){
    .sidebar-right{display:none;}
  }
  @media (max-width:920px){
    .sidebar-left{width:88px;padding:8px 4px;align-items:center;}
    .sidebar-left .nav-item span.label, .sidebar-left .user-card .uc-name-wrap{display:none;}
    .nav-item{justify-content:center;padding:12px;}
    .nav-post-btn{width:52px;height:52px;padding:0;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center;}
    .nav-post-btn .full-label{display:none;}
    .theme-toggle-btn{justify-content:center;padding:12px;border-radius:50%;}
    .theme-toggle-btn span.label{display:none;}
    .user-card{justify-content:center;}
    .main-col{width:100%;border-right:none;}
  }
</style>
</head>
<body>

<!-- ======= EDIT PROFILE MODAL ======= -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <button class="icon-close" id="close-modal">✕</button>
      <h2>Profili düzenle</h2>
      <div class="spacer"></div>
      <button id="save-profile-btn">Kaydet</button>
    </div>
    <div class="modal-banner" id="modal-banner">
      <div class="banner-edit-overlay">
        <button class="circle-edit-btn" id="modal-banner-upload-btn" title="Arkaplan yükle">🖼️</button>
        <button class="circle-edit-btn" id="modal-banner-remove-btn" title="Arkaplanı kaldır">✕</button>
      </div>
    </div>
    <div class="modal-avatar-row">
      <div class="modal-avatar" id="modal-avatar">
        <div class="avatar-edit-overlay">
          <button class="circle-edit-btn" id="modal-avatar-upload-btn" title="Profil fotoğrafı yükle">🖼️</button>
        </div>
      </div>
    </div>
    <div class="modal-form">
      <div class="field">
        <label for="edit-name">İsim</label>

  const me = profiles['@ben'];
  const target = profiles[handle];
  if(!target) return;
  if(me.following.includes(handle)){
    me.following = me.following.filter(h => h !== handle);
    target.followers = target.followers.filter(h => h !== '@ben');

    me.following.push(handle);
    target.followers.push('@ben');
  }
  renderAll();
}

/* ================= RENDER: FEED ================= */
function renderTweetHtml(t, opts){
  opts = opts || {};
  const p = profiles[t.author] || { name:t.author, handle:t.author, avatarColor:'linear-gradient(135deg,#888,#555)', avatarImg:null, verified:false };
  const expanded = expandedReplies.has(t.id);
  const replyCount = t.replies.length;
  return `
    <div class="tweet">
      <div class="avatar" style="${avatarStyle(p)}" onclick="goToProfile('${p.handle}')">${p.avatarImg ? '' : escapeHtml((p.name||'?')[0].toUpperCase())}</div>
      <div class="tweet-body">
        <div class="tweet-head">
          <span class="tweet-name" onclick="goToProfile('${p.handle}')">${escapeHtml(p.name)} ${verifiedBadge(p)}</span>
          <span class="tweet-handle">${escapeHtml(p.handle)}</span>
          <span class="tweet-time">· ${escapeHtml(t.time)}</span>
        </div>
        ${t.text ? `<div class="tweet-text">${escapeHtml(t.text)}</div>` : ''}
        ${t.image ? `<img class="tweet-img" src="${t.image}" alt="tweet görseli">` : ''}
        <div class="tweet-actions">
          <button class="action" onclick="openReplyModal(${t.id})">💬 ${replyCount}</button>
          <button class="action rt ${t.rted ? 'active' : ''}" onclick="toggleRt(${t.id})">🔁 ${t.rts}</button>
          <button class="action ${t.liked ? 'liked' : ''}" onclick="toggleLike(${t.id})">${t.liked ? '❤️' : '🤍'} ${t.likes}</button>
          <button class="action bookmark ${t.bookmarked ? 'active' : ''}" onclick="toggleBookmark(${t.id})">${t.bookmarked ? '🔖' : '🏷️'}</button>
          <button class="action" onclick="shareTweet(${t.id})">📤</button>
          ${t.author === '@ben' ? `<button class="action del" onclick="deleteTweet(${t.id})">🗑️</button>` : ''}
        </div>
        ${replyCount > 0 ? `<div style="margin-top:6px;"><span style="color:var(--blue);font-size:13px;cursor:pointer;" onclick="toggleExpandReplies(${t.id})">${expanded ? 'Yanıtları gizle' : replyCount + ' yanıtı gör'}</span></div>` : ''}
        ${expanded ? `<div class="reply-thread">${t.replies.map(r => renderReplyHtml(r)).join('')}</div>` : ''}
      </div>
    </div>
  `;
}
function renderReplyHtml(r){
  const p = profiles[r.author] || { name:r.author, handle:r.author, avatarColor:'linear-gradient(135deg,#888,#555)', avatarImg:null, verified:false };
  return `
    <div class="reply-item">
      <div class="avatar" style="${avatarStyle(p)}" onclick="goToProfile('${p.handle}')">${p.avatarImg ? '' : escapeHtml((p.name||'?')[0].toUpperCase())}</div>
      <div class="reply-body">
        <div class="reply-head">${escapeHtml(p.name)}${verifiedBadge(p)}<span>${escapeHtml(p.handle)} · ${escapeHtml(r.time)}</span></div>
        <div class="reply-text">${escapeHtml(r.text)}</div>
      </div>
    </div>
  `;
}

function renderFeed(){

    list = tweets.filter(t => following.includes(t.author) || t.author === '@ben');

  if(list.length === 0){
    feedEl.innerHTML = currentHomeTab === 'following'
      ? '<div class="empty"><span>🕊️</span>Takip ettiklerinden henüz tweet yok. Keşfet\'ten birilerini takip et.</div>'
      : '<div class="empty"><span>🕊️</span>Henüz goygoy yok. İlk paylaşımı sen yap.</div>';
    return;
  }
  feedEl.innerHTML = list.map(t => renderTweetHtml(t)).join('');
}

/* ================= RENDER: PROFILE ================= */
function renderProfile(){
  const p = profiles[currentProfileHandle];
  headerTitle.innerHTML = escapeHtml(p.name) + ' ' + verifiedBadge(p);
  const count = tweets.filter(t => t.author === currentProfileHandle).length;
  headerSub.textContent = count + ' Tweet';

  if(p.bannerImg){
    profileBanner.style.backgroundImage = `url('${p.bannerImg}')`;
    profileBanner.style.background = '';
  } else {
    profileBanner.style.backgroundImage = '';
    profileBanner.style.background = 'linear-gradient(135deg,#3a3f44,#16181c)';
  }

  profileAvatar.style.cssText = avatarStyle(p);
  profileAvatar.textContent = p.avatarImg ? '' : (p.name ? p.name[0].toUpperCase() : '?');

  profileName.innerHTML = escapeHtml(p.name) + ' ' + verifiedBadge(p);
  profileHandleEl.textContent = p.handle;

  if(p.bio && p.bio.trim().length > 0){
    profileBio.textContent = p.bio; profileBio.classList.remove('placeholder');
  } else {
    profileBio.textContent = p.editable ? 'Henüz bir açıklama eklenmemiş. "Profili düzenle" ile ekleyebilirsin.' : 'Bu kullanıcı henüz kendinden bahsetmemiş.';
    profileBio.classList.add('placeholder');
  }

  statTweets.textContent = count;
  statFollowing.textContent = p.following.length;
  statFollowers.textContent = p.followers.length;

  if(p.editable){
    profileActions.innerHTML = `<button class="btn-outline" onclick="openEditModal()">Profili düzenle</button>`;
    profileBanner.classList.add('editable');
    profileAvatarWrap.classList.add('editable');
  } else {
    const following = isFollowing(p.handle);
    profileActions.innerHTML = `<button class="btn-solid ${following ? 'btn-following' : ''}" onclick="toggleFollow('${p.handle}')">${following ? 'Takip ediliyor' : 'Takip et'}</button>`;
    profileBanner.classList.remove('editable');
    profileAvatarWrap.classList.remove('editable');
  }

  const ptweets = tweets.filter(t => t.author === currentProfileHandle);
  profileFeedEl.innerHTML = ptweets.length ? ptweets.map(t => renderTweetHtml(t)).join('') :
    '<div class="empty"><span>🕊️</span>Bu kullanıcı henüz tweet atmamış.</div>';
}

profileBanner.addEventListener('click', () => { if(profiles[currentProfileHandle].editable) openEditModal(); });
profileAvatarWrap.addEventListener('click', () => { if(profiles[currentProfileHandle].editable) openEditModal(); });

/* ================= RENDER: EXPLORE ================= */
function renderExplore(){
  const q = searchQuery.trim().toLowerCase();
  if(!q){
    exploreContent.innerHTML = `
      <div class="section-label">Gündemdekiler</div>
      ${trends.map(tr => `<div class="trend-item" onclick="searchFor('${tr.name.replace(/'/g,"\\'")}')">
        <div class="trend-cat">${escapeHtml(tr.cat)}</div>
        <div class="trend-name">${escapeHtml(tr.name)}</div>
        <div class="trend-count">${escapeHtml(tr.count)}</div>
      </div>`).join('')}
      <div class="section-label">Kimi takip etmeli</div>
      ${Object.values(profiles).filter(p => p.handle !== '@ben').map(p => renderUserRow(p)).join('')}
    `;
    return;
  }
  const matchedUsers = Object.values(profiles).filter(p =>
    p.handle !== '@ben' && (p.name.toLowerCase().includes(q) || p.handle.toLowerCase().includes(q))
  );
  const matchedTweets = tweets.filter(t => t.text.toLowerCase().includes(q));
  let html = '';
  html += `<div class="section-label">Kullanıcılar</div>`;
  html += matchedUsers.length ? matchedUsers.map(p => renderUserRow(p)).join('') : '<div class="empty" style="padding:20px;">Eşleşen kullanıcı yok.</div>';
  html += `<div class="section-label">Tweetler</div>`;
  html += matchedTweets.length ? matchedTweets.map(t => renderTweetHtml(t)).join('') : '<div class="empty" style="padding:20px;">Eşleşen tweet yok.</div>';
  exploreContent.innerHTML = html;
}
function renderUserRow(p){
  const following = isFollowing(p.handle);
  return `
    <div class="user-row">
      <div class="avatar" style="${avatarStyle(p)};cursor:pointer;" onclick="goToProfile('${p.handle}')">${p.avatarImg ? '' : escapeHtml((p.name||'?')[0].toUpperCase())}</div>
      <div class="uinfo" onclick="goToProfile('${p.handle}')" style="cursor:pointer;">
        <div class="uname">${escapeHtml(p.name)} ${verifiedBadge(p)}</div>
        <div class="uhandle">${escapeHtml(p.handle)}</div>
        <div class="ubio">${escapeHtml(p.bio || '')}</div>
      </div>
      <button class="follow-btn-small ${following ? 'following' : ''}" onclick="event.stopPropagation();toggleFollow('${p.handle}')">${following ? 'Takipte' : 'Takip et'}</button>
    </div>
  `;
}
function searchFor(text){
  searchQuery = text;
  goToExplore();
}
exploreSearch.addEventListener('input', () => { searchQuery = exploreSearch.value; renderExplore(); });

/* ================= RENDER: NOTIFICATIONS ================= */
function renderNotifications(){
  const notifFeed = document.getElementById('notif-feed');
  notifFeed.innerHTML = notifications.map(n => {
    const p = profiles[n.author] || {name:n.author, avatarColor:'linear-gradient(135deg,#888,#555)', avatarImg:null, verified:false};
    const icon = n.type === 'like' ? '❤️' : n.type === 'rt' ? '🔁' : '👤';
    const iconClass = n.type === 'like' ? 'like' : n.type === 'rt' ? 'rt' : 'follow';
    return `
      <div class="notif-item">
        <div class="notif-icon ${iconClass}">${icon}</div>
        <div class="avatar" style="${avatarStyle(p)};width:36px;height:36px;font-size:14px;cursor:pointer;" onclick="goToProfile('${p.handle}')"></div>
        <div class="notif-body">
          <div class="nb-name">${escapeHtml(p.name)} ${verifiedBadge(p)}</div>
          <div class="nb-text">${escapeHtml(n.text)} · ${escapeHtml(n.time)}</div>
        </div>
      </div>
    `;
  }).join('');
}

/* ================= RENDER: BOOKMARKS ================= */
function renderBookmarks(){
  const bookmarksFeed = document.getElementById('bookmarks-feed');
  const list = tweets.filter(t => t.bookmarked);
  bookmarksFeed.innerHTML = list.length ? list.map(t => renderTweetHtml(t)).join('') :
    '<div class="empty"><span>🔖</span>Henüz yer işareti eklemedin.</div>';
}

/* ================= RENDER: RIGHT SIDEBAR ================= */
function renderRightSidebar(){
  const trendsWidget = document.getElementById('widget-trends');
  trendsWidget.innerHTML = `<div class="widget-title">Gündemdekiler</div>` +
    trends.slice(0,4).map(tr => `<div class="trend-item" onclick="searchFor('${tr.name.replace(/'/g,"\\'")}');goToExplore();">
      <div class="trend-cat">${escapeHtml(tr.cat)}</div>
      <div class="trend-name">${escapeHtml(tr.name)}</div>
      <div class="trend-count">${escapeHtml(tr.count)}</div>
    </div>`).join('');

  const suggWidget = document.getElementById('widget-suggestions');
  const suggestions = Object.values(profiles).filter(p => p.handle !== '@ben' && !isFollowing(p.handle)).slice(0,3);
  suggWidget.innerHTML = `<div class="widget-title">Kimi takip etmeli</div>` +
    (suggestions.length ? suggestions.map(p => renderUserRow(p)).join('') : '<div style="padding:16px;color:var(--dim);font-size:14px;">Herkesi zaten takip ediyorsun 🎉</div>');
}

/* ================= TWEET ACTIONS ================= */
function toggleLike(id){
  const t = tweets.find(x => x.id === id); if(!t) return;
  t.liked = !t.liked; t.likes += t.liked ? 1 : -1;
  rerenderCurrent();
}
function toggleRt(id){
  const t = tweets.find(x => x.id === id); if(!t) return;
  t.rted = !t.rted; t.rts += t.rted ? 1 : -1;
  rerenderCurrent();
}
function toggleBookmark(id){
  const t = tweets.find(x => x.id === id); if(!t) return;
  t.bookmarked = !t.bookmarked;
  rerenderCurrent();
}
function deleteTweet(id){
  tweets = tweets.filter(x => x.id !== id);
  rerenderCurrent();
}
function shareTweet(id){
  alert('Bağlantı kopyalandı! (goygoy demo — gerçek bir link yok 😄)');
}
function rerenderCurrent(){
  if(currentView === 'home') renderFeed();
  else if(currentView === 'profile') renderProfile();
  else if(currentView === 'explore') renderExplore();
  else if(currentView === 'bookmarks') renderBookmarks();
  renderRightSidebar();
}
function renderAll(){
  updateSidebarUserCard();
  rerenderCurrent();
}

/* ================= REPLY MODAL ================= */
function openReplyModal(tweetId){
  currentReplyTweetId = tweetId;
  const t = tweets.find(x => x.id === tweetId);
  const p = profiles[t.author] || { name:t.author, handle:t.author, avatarColor:'linear-gradient(135deg,#888,#555)', avatarImg:null, verified:false };
  replyParent.innerHTML = `
    <div class="reply-parent-line"><div class="avatar" style="${avatarStyle(p)}">${p.avatarImg ? '' : escapeHtml((p.name||'?')[0].toUpperCase())}</div><div class="line"></div></div>
    <div class="reply-parent-body">
      <div class="rp-head"><span class="rp-name">${escapeHtml(p.name)}</span>${verifiedBadge(p)}<span class="rp-handle">${escapeHtml(p.handle)}</span><span class="rp-dim">· ${escapeHtml(t.time)}</span></div>
      <div class="rp-text">${escapeHtml(t.text)}</div>
      <div class="rp-to">Yanıt veriliyor: <span style="color:var(--blue);">${escapeHtml(p.handle)}</span></div>
    </div>
  `;
  const me = profiles['@ben'];
  replyAvatar.style.cssText = avatarStyle(me);
  replyAvatar.textContent = me.avatarImg ? '' : (me.name ? me.name[0].toUpperCase() : 'B');
  replyInput.value = '';
  submitReplyBtn.disabled = true;
  replyModalOverlay.classList.add('open');
  setTimeout(()=>replyInput.focus(), 50);
}
function closeReplyModal(){ replyModalOverlay.classList.remove('open'); currentReplyTweetId = null; }
closeReplyModalBtn.addEventListener('click', closeReplyModal);
replyModalOverlay.addEventListener('click', (e) => { if(e.target === replyModalOverlay) closeReplyModal(); });
replyInput.addEventListener('input', () => { submitReplyBtn.disabled = replyInput.value.trim().length === 0; });
submitReplyBtn.addEventListener('click', () => {
  const text = replyInput.value.trim();
  if(!text || currentReplyTweetId === null) return;
  const t = tweets.find(x => x.id === currentReplyTweetId);
  if(!t) return;
  t.replies.push({id: replyIdCounter++, author:'@ben', text, time:'şimdi'});
  expandedReplies.add(t.id);
  closeReplyModal();
  rerenderCurrent();
});

/* ================= EDIT PROFILE MODAL ================= */
function openEditModal(){
  const p = profiles['@ben'];
  modalTemp = { name:p.name, handle:p.handle, bio:p.bio, avatarImg:p.avatarImg, bannerImg:p.bannerImg, verified:p.verified };
  editName.value = p.name;
  editHandle.value = p.handle.replace('@','');
  editBio.value = p.bio;
  editVerified.checked = p.verified;
  bioCount.textContent = p.bio.length + ' / 160';
  renderModalPreview();
  modalOverlay.classList.add('open');
}
function closeEditModal(){ modalOverlay.classList.remove('open'); }
closeModalBtn.addEventListener('click', closeEditModal);
modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeEditModal(); });

function renderModalPreview(){
  if(modalTemp.bannerImg){
    modalBanner.style.backgroundImage = `url('${modalTemp.bannerImg}')`;
  } else {
    modalBanner.style.backgroundImage = '';
    modalBanner.style.background = 'linear-gradient(135deg,#3a3f44,#16181c)';
  }
  if(modalTemp.avatarImg){
    modalAvatar.style.backgroundImage = `url('${modalTemp.avatarImg}')`;
    modalAvatar.querySelector('.avatar-edit-overlay').style.opacity = '0';
  } else {
    modalAvatar.style.backgroundImage = '';
    modalAvatar.style.background = profiles['@ben'].avatarColor;
    modalAvatar.querySelector('.avatar-edit-overlay').style.opacity = '1';
  }
}
modalBannerUploadBtn.addEventListener('click', (e) => { e.stopPropagation(); modalBannerInput.click(); });
modalBanner.addEventListener('click', () => modalBannerInput.click());
modalBannerRemoveBtn.addEventListener('click', (e) => { e.stopPropagation(); modalTemp.bannerImg = null; renderModalPreview(); });
modalBannerInput.addEventListener('change', (e) => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => { modalTemp.bannerImg = ev.target.result; renderModalPreview(); };
  reader.readAsDataURL(file);
});
modalAvatarUploadBtn.addEventListener('click', (e) => { e.stopPropagation(); modalAvatarInput.click(); });
modalAvatar.addEventListener('click', () => modalAvatarInput.click());
modalAvatarInput.addEventListener('change', (e) => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => { modalTemp.avatarImg = ev.target.result; renderModalPreview(); };
  reader.readAsDataURL(file);
});
editBio.addEventListener('input', () => { bioCount.textContent = editBio.value.length + ' / 160'; });

saveProfileBtn.addEventListener('click', () => {
  const p = profiles['@ben'];
  const newName = editName.value.trim() || 'Sen';
  let newHandleRaw = editHandle.value.trim().replace(/^@/,'').replace(/\s+/g,'');
  if(!newHandleRaw) newHandleRaw = 'ben';
  const newHandle = '@' + newHandleRaw;

  if(newHandle !== p.handle && !profiles[newHandle]){
    tweets.forEach(t => { if(t.author === p.handle) t.author = newHandle; t.replies.forEach(r => { if(r.author === p.handle) r.author = newHandle; }); });
    Object.values(profiles).forEach(other => {
      other.following = other.following.map(h => h === p.handle ? newHandle : h);
      other.followers = other.followers.map(h => h === p.handle ? newHandle : h);
    });
    delete profiles[p.handle];
    p.handle = newHandle;
    profiles[newHandle] = p;
    currentProfileHandle = newHandle;
  }

  p.name = newName;
  p.bio = editBio.value.trim();
  p.avatarImg = modalTemp.avatarImg;
  p.bannerImg = modalTemp.bannerImg;
  p.verified = editVerified.checked;

  closeEditModal();
  updateMyAvatarComposer();
  updateSidebarUserCard();
  rerenderCurrent();
});

/* ================= SIDEBAR / COMPOSER MINI-STATE ================= */
function updateMyAvatarComposer(){
  const p = profiles['@ben'];
  myAvatarComposer.style.cssText = avatarStyle(p);
  myAvatarComposer.textContent = p.avatarImg ? '' : (p.name ? p.name[0].toUpperCase() : 'B');
}
myAvatarComposer.addEventListener('click', () => goToProfile('@ben'));

function updateSidebarUserCard(){
  const p = profiles['@ben'];
  sidebarAvatar.style.cssText = avatarStyle(p);
  sidebarAvatar.textContent = p.avatarImg ? '' : (p.name ? p.name[0].toUpperCase() : 'B');
  sidebarUcName.innerHTML = escapeHtml(p.name) + ' ' + verifiedBadge(p);
  sidebarUcHandle.textContent = p.handle;
}

/* ================= COMPOSER ================= */
function updatePostBtn(){
  const len = input.value.length;
  postBtn.disabled = !(input.value.trim().length > 0 || pendingImage) || len > 280;
  if(len === 0){ charCount.textContent = ''; charCount.className='char-count'; }
  else {
    charCount.textContent = (280-len);
    charCount.className = 'char-count' + (len > 280 ? ' over' : len > 260 ? ' warn' : '');
  }
}
input.addEventListener('input', updatePostBtn);
addPhotoBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => { pendingImage = ev.target.result; previewImg.src = pendingImage; previewWrap.style.display='block'; updatePostBtn(); };
  reader.readAsDataURL(file);
});
removeImgBtn.addEventListener('click', () => { pendingImage=null; previewWrap.style.display='none'; fileInput.value=''; updatePostBtn(); });

postBtn.addEventListener('click', () => {
  const text = input.value.trim();
  if((!text && !pendingImage) || text.length > 280) return;
  tweets.unshift({ id: idCounter++, author:'@ben', time:'şimdi', text, image:pendingImage, likes:0, liked:false, rts:0, rted:false, bookmarked:false, replies:[] });
  input.value=''; pendingImage=null; previewWrap.style.display='none'; fileInput.value='';
  updatePostBtn();
  renderFeed();
  renderRightSidebar();
});

/* ================= INIT ================= */
updateMyAvatarComposer();
updateSidebarUserCard();
updatePostBtn();
renderRightSidebar();
goHome();
</script>
</body>
